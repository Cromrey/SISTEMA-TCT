<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="tctBgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d333b" />
      <stop offset="45%" stop-color="#191d24" />
      <stop offset="80%" stop-color="#0a0c0f" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Camera Body Gradient -->
    <linearGradient id="tctCameraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222831" />
      <stop offset="50%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0b0e13" />
    </linearGradient>

    <!-- Camera Border Subtle Highlight -->
    <linearGradient id="tctCameraBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Lens Optical Multi-Coating Gradient -->
    <radialGradient id="tctLensCore" cx="42%" cy="36%" r="64%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="18%" stop-color="#ea580c" />
      <stop offset="38%" stop-color="#e11d48" />
      <stop offset="58%" stop-color="#7c3aed" />
      <stop offset="78%" stop-color="#0284c7" />
      <stop offset="92%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Amber Flare -->
    <linearGradient id="tctFlareAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#fed7aa" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0" />
    </linearGradient>

    <!-- Cyan Flare -->
    <linearGradient id="tctFlareCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter for Letters & Elements -->
    <filter id="tctDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- 1. Circular Outer Background -->
  <circle cx="500" cy="500" r="490" fill="url(#tctBgGrad)" stroke="#1e242c" stroke-width="6" />

  <!-- 2. Camera Body Silhouette Behind Letters -->
  <g filter="url(#tctDropShadow)">
    <!-- Top shutter button -->
    <rect x="220" y="270" width="90" height="24" rx="8" fill="#374151" stroke="#4b5563" stroke-width="2" />
    <rect x="230" y="274" width="70" height="6" rx="3" fill="#6b7280" opacity="0.8" />

    <!-- Main DSLR Camera Body Contour -->
    <path
      d="M 330 295 
         L 385 240 
         Q 405 224, 430 224 
         L 570 224 
         Q 595 224, 615 240 
         L 670 295 
         Q 770 295, 795 320 
         Q 815 345, 815 395 
         L 815 600 
         Q 815 675, 745 675 
         L 255 675 
         Q 185 675, 185 600 
         L 185 395 
         Q 185 345, 205 320 
         Q 230 295, 330 295 Z"
      fill="url(#tctCameraGrad)"
      stroke="url(#tctCameraBorder)"
      stroke-width="10"
      stroke-linejoin="round"
    />
  </g>

  <!-- 3. Bold White Lettering: T - C - T -->
  <g filter="url(#tctDropShadow)">
    <!-- Left 'T' -->
    <path
      d="M 158 356 
         L 330 356 
         L 330 422 
         L 278 422 
         L 278 684 
         L 210 684 
         L 210 422 
         L 158 422 Z"
      fill="#ffffff"
    />

    <!-- Right 'T' -->
    <path
      d="M 670 356 
         L 842 356 
         L 842 422 
         L 790 422 
         L 790 684 
         L 722 684 
         L 722 422 
         L 670 422 Z"
      fill="#ffffff"
    />

    <!-- Center 'C' Sculpted Around the Lens -->
    <path
      d="M 578 382 
         C 532 344, 468 344, 422 382 
         C 348 438, 348 562, 422 618 
         C 468 656, 532 656, 578 618 
         L 544 560 
         C 520 578, 480 578, 458 560 
         C 418 524, 418 476, 458 440 
         C 480 422, 520 422, 544 440 Z"
      fill="#ffffff"
    />
  </g>

  <!-- 4. Ultra-Realistic Optical Camera Lens (Inside 'C') -->
  <g id="camera-lens">
    <!-- Outer Knurled Metal Lens Barrel -->
    <circle cx="500" cy="500" r="118" fill="#1e293b" stroke="#0f172a" stroke-width="5" />
    <circle cx="500" cy="500" r="110" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4" />
    <circle cx="500" cy="500" r="102" fill="#090d16" stroke="#334155" stroke-width="3" />
    <circle cx="500" cy="500" r="95" fill="#020617" />

    <!-- Optical Multi-Coated Core Glass -->
    <circle cx="500" cy="500" r="90" fill="url(#tctLensCore)" />

    <!-- Concentric Internal Optical Rings -->
    <circle cx="500" cy="500" r="74" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.65" />
    <circle cx="500" cy="500" r="56" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" />
    <circle cx="500" cy="500" r="42" fill="#020617" stroke="#1e293b" stroke-width="3" />

    <!-- Aperture Deep Black Center -->
    <circle cx="500" cy="500" r="28" fill="#000000" />

    <!-- Warm Golden/Amber Optical Reflection (Top Left) -->
    <ellipse cx="468" cy="466" rx="46" ry="28" fill="url(#tctFlareAmber)" transform="rotate(-35 468 466)" />

    <!-- Cool Cyan Flare Refraction (Bottom Right) -->
    <ellipse cx="532" cy="534" rx="38" ry="22" fill="url(#tctFlareCyan)" transform="rotate(-35 532 534)" />

    <!-- Specular Highlight Points on Glass Surface -->
    <circle cx="478" cy="472" r="8" fill="#ffffff" opacity="0.95" />
    <circle cx="488" cy="482" r="3.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- 5. Condensed Bold White Bottom Text: "CORPORACIÓN TCT" -->
  <g filter="url(#tctDropShadow)">
    <text
      x="500"
      y="788"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Impact', 'Arial Black', sans-serif"
      font-size="78"
      font-weight="900"
      letter-spacing="14"
    >CORPORACIÓN TCT</text>
  </g>
</svg>
